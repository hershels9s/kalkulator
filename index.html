<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Harga</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header class="topbar">
  <div>
    <div class="eyebrow">PRICE CALCULATOR</div>
    <h1>Kalkulator Harga</h1>
    <p>Hitung harga dengan cepat berdasarkan kategori, item, dan tipe Lokal / Import.</p>
  </div>
  <button class="btn ghost" id="resetData">↻ Reset Data</button>
</header>

<main class="layout">
<section class="panel calculator">
  <div class="section-head">
    <div><h2>Daftar Harga</h2><span id="itemCount"></span></div>
    <input id="search" class="search" placeholder="🔎 Cari kategori atau item..." autocomplete="off">
  </div>
  <div id="catalog"></div>
</section>

<aside class="panel order-panel">
  <div class="section-head">
    <div><h2>Pesanan</h2><span id="orderCount">0 item</span></div>
    <button class="btn danger small" id="clearOrder">Kosongkan</button>
  </div>
  <div id="orderList" class="order-list">
    <div class="empty">Belum ada item.<br>Pilih item dari daftar harga.</div>
  </div>
  <div class="total-box">
    <span>Total</span><strong id="grandTotal">Rp 0</strong>
  </div>
</aside>
</main>

<section class="panel admin">
  <div class="section-head">
    <div><h2>Kelola Harga & Kategori</h2><span>Perubahan tersimpan otomatis di browser.</span></div>
    <button class="btn primary" id="addCategory">＋ Kategori</button>
  </div>
  <div id="adminList"></div>
</section>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><h3 id="modalTitle">Edit</h3><button class="icon-btn" id="closeModal">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
